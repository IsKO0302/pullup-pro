<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="description" content="PULLUP PRO — интерактивная платформа тренировок подтягиваний и выхода силой (Muscle-Up)">
<title>PULLUP PRO — подтягивания и Muscle-Up</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6a1a'/%3E%3Cpath d='M10 16h44' stroke='%23000' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M22 16v14l10 8 10-8V16' stroke='%23000' stroke-width='6' fill='none' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='26' r='5' fill='%23000'/%3E%3Cpath d='M32 38v14' stroke='%23000' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>/* ================= PULLUP PRO — styles ================= */
:root{
  --bg:#09090b;--bg2:#0e0e11;--panel:#131317;--panel2:#18181d;--panel3:#1f1f25;
  --line:#25252c;--line2:#34343d;--tx:#f5f5f7;--tx2:#c2c2cb;--mut:#8a8a96;--mut2:#5f5f6a;
  --acc:#ff6a1a;--acc2:#ff2e2e;--accRGB:255,106,26;--accTx:#120700;
  --ok:#35d07f;--okRGB:53,208,127;--warn:#ffb21e;--bad:#ff4040;--badRGB:255,64,64;
  --r:18px;--r2:13px;--r3:9px;
  --fd:"Arial Black","Segoe UI Black","Helvetica Neue",Arial,system-ui,sans-serif;
  --fb:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --side:250px;--tab:66px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --shadow:0 18px 50px rgba(0,0,0,.55);
}
body.acc-red{--acc:#ff3030;--acc2:#ff7a1a;--accRGB:255,48,48;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--fb);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body.noscroll{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
img,svg{display:block}
::selection{background:rgba(var(--accRGB),.35)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.ico{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:inline-block;vertical-align:-.18em}
.ico.fill{fill:currentColor;stroke:none}
h1,h2,h3,h4{margin:0;line-height:1.15}
p{margin:0 0 .6em}
.disp{font-family:var(--fd);font-weight:900;text-transform:uppercase;letter-spacing:-.01em;font-style:italic}
.muted{color:var(--mut)}.tx2{color:var(--tx2)}.acc{color:var(--acc)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.small{font-size:13px}.tiny{font-size:12px}.big{font-size:18px}
.num{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 16px;border-right:1px solid var(--line);background:linear-gradient(180deg,#0d0d10,#09090b);overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#000;box-shadow:0 6px 22px rgba(var(--accRGB),.35);flex-shrink:0}
.brand-mark svg{width:24px;height:24px}
.brand-text{font-family:var(--fd);font-weight:900;font-style:italic;font-size:21px;letter-spacing:-.02em}
.brand-text b{color:var(--acc);margin-left:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--tx2);font-weight:600;font-size:14.5px;transition:background .15s,color .15s}
.nav a .ico{width:19px;height:19px;color:var(--mut)}
.nav a:hover{background:var(--panel2);color:var(--tx)}
.nav a.on{background:linear-gradient(90deg,rgba(var(--accRGB),.18),rgba(var(--accRGB),.04));color:var(--tx)}
.nav a.on .ico{color:var(--acc)}
.nav .nav-sep{height:1px;background:var(--line);margin:8px 6px}
.side-level{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.view{width:100%;max-width:1320px;margin:0 auto;padding:30px 34px 60px;outline:none;animation:viewIn .35s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tabbar{display:none}

/* ---------- page head ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-family:var(--fd);font-weight:900;font-style:italic;text-transform:uppercase;font-size:38px;letter-spacing:-.02em}
.page-head h1 em{font-style:italic;color:var(--acc)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.eyebrow:before{content:"";width:18px;height:3px;border-radius:2px;background:var(--acc)}
.page-head .sub{color:var(--mut);margin-top:6px;max-width:680px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;font-size:14px;margin-bottom:12px}
.back:hover{color:var(--tx)}

/* ---------- grid / flex ---------- */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span-all{grid-column:1/-1}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}.row.top{align-items:flex-start}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.s{gap:8px}.stack.l{gap:18px}
.grow{flex:1;min-width:0}
.mt{margin-top:14px}.mt-s{margin-top:8px}.mt-l{margin-top:24px}.mb{margin-bottom:14px}.mb-l{margin-bottom:24px}

/* ---------- card ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;min-width:0}
.card.flat{background:var(--bg2)}
.card.tight{padding:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head h3,.card-title{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:9px}
.card-head h3 .ico{color:var(--acc)}
.card-head .hint{color:var(--mut);font-size:13px}
.card.accent{border-color:rgba(var(--accRGB),.45);background:linear-gradient(160deg,rgba(var(--accRGB),.13),var(--panel) 55%)}
.card.link{transition:border-color .15s,transform .15s}
.card.link:hover{border-color:var(--line2);transform:translateY(-2px)}
.divider{height:1px;background:var(--line);margin:16px 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);font-weight:700;font-size:14.5px;white-space:nowrap;transition:transform .1s,background .15s,border-color .15s,box-shadow .15s,opacity .15s;user-select:none;text-decoration:none}
.btn:hover{background:var(--panel3);border-color:#44444f}
.btn:active{transform:scale(.97)}
.btn[disabled],.btn.disabled{opacity:.42;pointer-events:none}
.btn-acc{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;box-shadow:0 8px 26px rgba(var(--accRGB),.3);text-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn-acc:hover{background:linear-gradient(135deg,var(--acc),var(--acc2));filter:brightness(1.08);border-color:transparent;box-shadow:0 10px 32px rgba(var(--accRGB),.42)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.btn-ghost:hover{background:var(--panel2);border-color:transparent;color:var(--tx)}
.btn-out{background:transparent;border-color:rgba(var(--accRGB),.6);color:var(--acc)}
.btn-out:hover{background:rgba(var(--accRGB),.1);border-color:var(--acc)}
.btn-danger{background:rgba(var(--badRGB),.12);border-color:rgba(var(--badRGB),.45);color:#ff7b7b}
.btn-danger:hover{background:rgba(var(--badRGB),.2);border-color:var(--bad)}
.btn-sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:10px;gap:6px}
.btn-lg{min-height:54px;padding:0 26px;font-size:16px;border-radius:15px}
.btn-xl{min-height:62px;padding:0 30px;font-size:17px;border-radius:17px;letter-spacing:.04em;text-transform:uppercase;font-weight:900}
.btn-block{width:100%}
.btn-icon{width:40px;min-height:40px;padding:0;border-radius:11px}
.btn-icon.btn-sm{width:34px;min-height:34px}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.link-btn{background:none;border:0;padding:0;color:var(--acc);font-weight:700;cursor:pointer}
.link-btn:hover{text-decoration:underline}

/* ---------- chips / seg / badge ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--tx2);font-size:13.5px;font-weight:600;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:#4a4a55;color:var(--tx)}
.chip.on{background:rgba(var(--accRGB),.16);border-color:rgba(var(--accRGB),.7);color:var(--tx)}
.chip .cnt{font-size:12px;color:var(--mut)}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--mut);font-weight:700;font-size:13.5px;padding:7px 13px;border-radius:9px;min-height:34px}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--panel3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.seg.acc button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.03em;background:var(--panel3);color:var(--tx2);white-space:nowrap}
.b-acc{background:rgba(var(--accRGB),.16);color:var(--acc)}
.b-ok{background:rgba(var(--okRGB),.14);color:var(--ok)}
.b-warn{background:rgba(255,178,30,.14);color:var(--warn)}
.b-bad{background:rgba(var(--badRGB),.14);color:#ff6b6b}
.b-solid{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px;min-width:0}
.kpi-l{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.kpi-l .ico{color:var(--acc)}
.kpi-v{font-family:var(--fd);font-weight:900;font-size:30px;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-v small{font-family:var(--fb);font-size:14px;color:var(--mut);font-weight:700;margin-left:4px;letter-spacing:0}
.kpi-s{font-size:12.5px;color:var(--mut);margin-top:3px}

/* ---------- progress ---------- */
.bar{height:8px;border-radius:99px;background:var(--panel3);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.ok>i{background:var(--ok)}
.bar.thin{height:5px}
.ring{position:relative;display:grid;place-items:center;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .rg-bg{stroke:var(--panel3)}
.ring .rg-fg{stroke:url(#accGrad);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring.ok .rg-fg{stroke:var(--ok)}
.ring .rg-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .rg-v{font-family:var(--fd);font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.ring .rg-l{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li-main{flex:1;min-width:0}
.li-t{font-weight:700}
.li-s{font-size:13px;color:var(--mut)}
.li-ico{width:38px;height:38px;border-radius:11px;background:var(--panel3);display:grid;place-items:center;color:var(--acc);flex-shrink:0}
.li-ico.acc{background:rgba(var(--accRGB),.15)}
.ul{margin:0;padding-left:20px}
.ul li{margin:4px 0}
.ol{margin:0;padding:0;list-style:none;counter-reset:s}
.ol li{counter-increment:s;position:relative;padding:6px 0 6px 38px;min-height:30px}
.ol li:before{content:counter(s);position:absolute;left:0;top:4px;width:26px;height:26px;border-radius:8px;background:rgba(var(--accRGB),.15);color:var(--acc);font-weight:900;font-size:13px;display:grid;place-items:center}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:4px 10px;border-radius:8px;background:var(--panel3);color:var(--tx2);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--mut);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.lbl{font-size:12.5px;font-weight:700;color:var(--tx2);letter-spacing:.02em}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:10px 13px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--tx);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.inp{min-height:90px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--accRGB),.18)}
.inp.sm{min-height:36px;padding:6px 10px;border-radius:10px;font-size:14px}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select.inp option{background:#16161a}
input[type=date].inp{color-scheme:dark}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.switch{position:relative;display:inline-flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch i{width:46px;height:27px;border-radius:99px;background:var(--panel3);border:1px solid var(--line2);position:relative;transition:background .2s;flex-shrink:0}
.switch i:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#cfcfd6;transition:transform .2s,background .2s}
.switch input:checked+i{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
.switch input:checked+i:after{transform:translateX(19px);background:#fff}
.switch input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
.check{position:relative;display:flex;align-items:flex-start;gap:11px;padding:9px 0;cursor:pointer;user-select:none}
.check input{position:absolute;opacity:0;width:0;height:0}
.check .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;flex-shrink:0;transition:all .15s;margin-top:1px}
.check .box .ico{width:14px;height:14px;stroke-width:3;opacity:0;color:#fff}
.check input:checked+.box{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
.check input:checked+.box .ico{opacity:1}
.check input:focus-visible+.box{outline:2px solid var(--acc);outline-offset:2px}
.tasks .check input:checked~.ct,.warm-list .check input:checked~.ct{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.check.auto{cursor:default}
.check.auto .box{border-color:var(--line2)}
.check.auto.met .box{background:var(--ok);border-color:transparent}
.check.auto.met .box .ico{opacity:1}
.check .ct{flex:1;min-width:0}
.check .cs{display:block;font-size:12.5px;color:var(--mut)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:12px;background:var(--bg2);overflow:hidden}
.stepper button{width:38px;height:40px;border:0;background:transparent;color:var(--tx2);display:grid;place-items:center}
.stepper button:hover{background:var(--panel3);color:var(--tx)}
.stepper input{width:58px;text-align:center;border:0;background:transparent;height:40px;outline:none;font-weight:800;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{min-width:48px;height:44px;border-radius:11px;border:1px solid var(--line2);background:var(--bg2);font-weight:800;color:var(--tx2);padding:0 10px}
.rate button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.rate button small{display:block;font-size:10px;font-weight:700;opacity:.8}

/* ---------- notes ---------- */
.note{display:flex;gap:12px;padding:13px 15px;border-radius:var(--r2);background:var(--panel2);border:1px solid var(--line2);font-size:14px;color:var(--tx2);align-items:flex-start}
.note>.ico{margin-top:2px;width:19px;height:19px}
.note b{color:var(--tx)}
.n-warn{background:rgba(255,178,30,.08);border-color:rgba(255,178,30,.35)}.n-warn>.ico{color:var(--warn)}
.n-bad{background:rgba(var(--badRGB),.08);border-color:rgba(var(--badRGB),.4)}.n-bad>.ico{color:var(--bad)}
.n-ok{background:rgba(var(--okRGB),.07);border-color:rgba(var(--okRGB),.35)}.n-ok>.ico{color:var(--ok)}
.n-acc{background:rgba(var(--accRGB),.08);border-color:rgba(var(--accRGB),.35)}.n-acc>.ico{color:var(--acc)}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.empty .ico{width:38px;height:38px;color:var(--line2);margin:0 auto 10px}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:300;background:rgba(3,3,5,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .2s}
.modal-wrap.in{opacity:1}
.modal{width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:22px;box-shadow:var(--shadow);transform:translateY(14px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.modal-wrap.in .modal{transform:none}
.modal.wide{width:min(820px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0}
.modal-head h3{font-family:var(--fd);font-weight:900;font-style:italic;text-transform:uppercase;font-size:20px;letter-spacing:-.01em}
.modal-body{padding:16px 20px;overflow-y:auto;overscroll-behavior:contain}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.steps-dots{display:flex;gap:6px;margin-bottom:14px}
.steps-dots i{height:4px;flex:1;border-radius:9px;background:var(--panel3)}
.steps-dots i.on{background:linear-gradient(90deg,var(--acc),var(--acc2))}

/* ---------- toast ---------- */
#toasts{position:fixed;right:20px;bottom:20px;z-index:500;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none;max-width:min(380px,calc(100vw - 40px))}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:#1c1c22;border:1px solid var(--line2);box-shadow:var(--shadow);font-size:14px;font-weight:600;opacity:0;transform:translateY(10px);transition:all .25s}
.toast.in{opacity:1;transform:none}
.toast .ico{color:var(--acc)}
.t-ok .ico{color:var(--ok)}.t-err{border-color:rgba(var(--badRGB),.5)}.t-err .ico{color:var(--bad)}
.t-xp{border-color:rgba(var(--accRGB),.6);background:linear-gradient(135deg,#2a160b,#1c1c22)}

/* ---------- figure ---------- */
.fig{position:relative;display:flex;flex-direction:column;align-items:center;user-select:none}
.fig-stage{position:relative;width:100%;aspect-ratio:200/280;max-height:100%;cursor:pointer}
.fig-svg{width:100%;height:100%;overflow:hidden}
.fig .seg{stroke:#e9e9ee;stroke-linecap:round;fill:none}
.fig .segf{fill:#ececf0;stroke:#0d0d10;stroke-width:1.7;stroke-linejoin:round}
.fig .segf.hl{fill:var(--acc);filter:url(#figGlow)}
.fig .head{fill:#ececf0;stroke:#0d0d10;stroke-width:1.7}
.fig .seg.s-n{stroke:#d4d4da}
.fig .jt{fill:#ececf0;stroke:#0d0d10;stroke-width:1.5}
.fig .prop{stroke:#5d5d68;stroke-linecap:round;fill:none}
.fig .prop-f{fill:#3a3a44}
.fig .bar-c{fill:#7d7d89;stroke:#b9b9c4;stroke-width:1.6}
.fig .floor{stroke:#2c2c34;stroke-width:2}
.fig .band{stroke:var(--acc2);stroke-width:2.6;fill:none;stroke-linecap:round;opacity:.9}
.fig .plate{fill:#2a2a31;stroke:#8d8d98;stroke-width:2}
.fig .shadow{fill:rgba(0,0,0,.45)}
.fig-label{margin-top:8px;min-height:22px;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);text-align:center;transition:opacity .2s}
.fig-prog{width:70%;height:3px;border-radius:9px;background:var(--panel3);overflow:hidden;margin-top:6px}
.fig-prog i{display:block;height:100%;width:0;background:var(--acc)}
.fig-paused{position:absolute;inset:auto 8px 8px auto;display:none;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.6);font-size:12px;font-weight:700;color:var(--tx2)}
.fig.paused .fig-paused{display:flex}
.fig-box{background:radial-gradient(ellipse at 50% 35%,rgba(var(--accRGB),.12),transparent 62%),linear-gradient(180deg,#121216,#0c0c0f);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* ---------- charts ---------- */
.chart{position:relative;width:100%;min-height:120px}
.chart canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.chart-tip{position:absolute;pointer-events:none;z-index:5;background:#1d1d23;border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap;opacity:0;transition:opacity .12s;line-height:1.45}
.chart-tip.on{opacity:1}
.chart-tip b{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:2px}
.chart-tip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mut);font-size:14px;padding:20px;border:1px dashed var(--line2);border-radius:var(--r2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- heatmap ---------- */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:100%;min-width:13px;aspect-ratio:1;border-radius:4px;background:var(--panel3);display:block}
.heat i.l1{background:rgba(var(--accRGB),.28)}.heat i.l2{background:rgba(var(--accRGB),.5)}.heat i.l3{background:rgba(var(--accRGB),.75)}.heat i.l4{background:var(--acc)}
.heat i.fut{background:transparent;border:1px dashed var(--line)}
.heat-wrap{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:stretch}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--mut);align-items:center}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;border:1px solid var(--line);background:linear-gradient(115deg,#141418 0%,#0d0d10 55%,#1b0e07 100%);padding:34px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:20px;min-height:360px}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-60deg,transparent 0 22px,rgba(255,255,255,.018) 22px 44px);pointer-events:none}
.hero:after{content:"";position:absolute;right:-120px;top:-120px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(var(--accRGB),.3),transparent 65%);pointer-events:none}
.hero-l{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-family:var(--fd);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(44px,6.2vw,86px);line-height:.92;letter-spacing:-.035em}
.hero h1 span{display:block;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.hero-motto{font-size:20px;font-weight:700;margin-top:16px;min-height:30px;transition:opacity .4s,transform .4s}
.hero-motto.out{opacity:0;transform:translateY(6px)}
.hero-sub{color:var(--mut);margin-top:6px;max-width:520px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.hero-r{position:relative;z-index:1;display:flex;align-items:center;justify-content:center}
.hero-r .fig{width:min(300px,100%)}
.hero-r .fig-stage{max-height:340px}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.level-card .lv{display:flex;align-items:center;gap:16px}
.lv-badge{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-family:var(--fd);font-weight:900;font-size:28px;color:#fff;flex-shrink:0;box-shadow:0 10px 30px rgba(var(--accRGB),.3);font-style:italic}
.lv-badge.sm{width:42px;height:42px;border-radius:12px;font-size:19px}
.lv-title{font-family:var(--fd);font-weight:900;font-size:20px;font-style:italic;text-transform:uppercase}
.goal-ring-row{display:flex;gap:18px;align-items:center}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:260px}.quick .btn{padding-left:4px;padding-right:4px;justify-content:center;min-width:0}
.ready{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--bg2)}
.ready .dotc{width:12px;height:12px;border-radius:50%;margin-top:5px;flex-shrink:0;box-shadow:0 0 0 4px rgba(255,255,255,.04)}
.ready.go .dotc{background:var(--ok)}.ready.easy .dotc{background:var(--warn)}.ready.rest .dotc{background:var(--bad)}
.next-ex{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.next-ex div{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 10px;border-radius:9px;background:var(--bg2)}
.next-ex div span:last-child{color:var(--acc);font-weight:800;white-space:nowrap}
.rec-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rec{padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.rec .rv{font-family:var(--fd);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.rec .rl{font-size:12px;color:var(--mut);font-weight:700}
.tip{font-size:16px;line-height:1.5;font-weight:600}

/* ---------- programs ---------- */
.prog-card{display:flex;flex-direction:column;gap:12px;overflow:hidden}
.prog-card .pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.prog-name{font-family:var(--fd);font-weight:900;font-style:italic;font-size:26px;letter-spacing:-.02em}
.prog-range{font-size:13px;color:var(--acc);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.prog-card .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--acc),var(--acc2));opacity:0}
.prog-card.cur .stripe{opacity:1}
.wk{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--bg2)}
.wk-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--panel2);flex-wrap:wrap}
.wk-h b{font-family:var(--fd);font-style:italic;font-size:17px;text-transform:uppercase}
.wk-r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.wk-r .dose{font-weight:800;color:var(--acc);white-space:nowrap}
.wk-r .rest{font-size:12.5px;color:var(--mut);white-space:nowrap}
.wk-r a:hover{color:var(--acc)}
.crit{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--bg2);font-size:14px}
.crit .ico{color:var(--mut)}
.crit.met .ico{color:var(--ok)}
.crit .cv{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;color:var(--tx2);white-space:nowrap}

/* ---------- MU ---------- */
.mu-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:20px}
.mu-st{position:relative;padding:14px 12px;border-radius:15px;border:1px solid var(--line);background:var(--panel);text-align:left;color:var(--tx2);transition:all .15s;min-width:0}
.mu-st:hover{border-color:var(--line2)}
.mu-st .n{font-family:var(--fd);font-weight:900;font-size:22px;font-style:italic;color:var(--mut2)}
.mu-st .t{display:block;font-size:13px;font-weight:700;line-height:1.25;margin-top:2px}
.mu-st .s{display:block;font-size:11.5px;color:var(--mut);margin-top:6px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.mu-st.done{border-color:rgba(var(--okRGB),.4)}
.mu-st.done .n{color:var(--ok)}
.mu-st.cur{border-color:rgba(var(--accRGB),.7);background:linear-gradient(160deg,rgba(var(--accRGB),.16),var(--panel))}
.mu-st.cur .n{color:var(--acc)}
.mu-st.sel{box-shadow:0 0 0 2px var(--tx) inset}
.mu-st.lock{opacity:.72}
.mu-st .bar{margin-top:8px}
.sec-t{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:8px 0;position:relative}
.tl .dt{width:16px;height:16px;border-radius:50%;border:3px solid var(--line2);background:var(--bg);margin-left:6px;position:relative;z-index:1}
.tl.done .dt{border-color:var(--ok);background:var(--ok)}
.tl.cur .dt{border-color:var(--acc)}
.tl:not(:last-child):after{content:"";position:absolute;left:13px;top:28px;bottom:-12px;width:2px;background:var(--line)}
.tl.done:not(:last-child):after{background:rgba(var(--okRGB),.5)}

/* ---------- library ---------- */
.lib-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1;min-width:220px;max-width:420px}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search input{padding-left:40px}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ex-card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;transition:border-color .15s,transform .15s;text-align:left}
.ex-card:hover{border-color:rgba(var(--accRGB),.55);transform:translateY(-2px)}
.ex-card .ex-fig{height:180px;background:radial-gradient(ellipse at 50% 40%,rgba(var(--accRGB),.1),transparent 65%),#0e0e11;display:flex;justify-content:center;padding:8px 0 0}
.ex-card .ex-fig .fig{height:100%;width:auto}
.ex-card .ex-fig .fig-stage{height:100%;width:auto}
.ex-card .ex-fig .fig-label{display:none}
.ex-card .ex-b{padding:13px 14px 15px;display:flex;flex-direction:column;gap:6px;flex:1}
.ex-card .ex-n{font-weight:800;font-size:15.5px;line-height:1.25}
.ex-card .ex-m{font-size:12.5px;color:var(--mut)}
.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:6px;height:12px;border-radius:2px;background:var(--panel3);transform:skewX(-14deg)}
.lvl i.on{background:var(--acc)}
.ex-detail{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:20px;align-items:start}
.ex-detail .fig-box{position:sticky;top:20px}

/* ---------- journal ---------- */
.month-h{font-family:var(--fd);font-weight:900;font-style:italic;text-transform:uppercase;font-size:18px;margin:22px 0 10px;display:flex;align-items:center;gap:12px}
.month-h small{font-family:var(--fb);font-style:normal;font-weight:700;color:var(--mut);font-size:13px;text-transform:none}
.sess{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);margin-bottom:10px;overflow:hidden}
.sess-h{display:flex;align-items:center;gap:14px;padding:13px 15px;cursor:pointer}
.sess-h:hover{background:var(--panel2)}
.sess-date{width:50px;text-align:center;flex-shrink:0}
.sess-date b{display:block;font-family:var(--fd);font-size:22px;line-height:1}
.sess-date span{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase}
.sess-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:2px}
.sess-meta b{color:var(--tx2)}
.sess-b{padding:4px 15px 15px;border-top:1px solid var(--line);display:none}
.sess.open .sess-b{display:block}
.sess.open .sess-chev{transform:rotate(180deg)}
.sess-chev{transition:transform .2s;color:var(--mut)}
.set-line{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;flex-wrap:wrap}
.set-line:last-child{border-bottom:0}
.set-line .sl-n{font-weight:700;min-width:160px}
.set-line .sl-v{color:var(--tx2)}
.set-line .sl-v i{font-style:normal;color:var(--mut)}
.ed-item{border:1px solid var(--line);border-radius:var(--r2);padding:12px;background:var(--bg2);margin-bottom:10px}
.ed-sets{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ed-set{display:grid;grid-template-columns:28px repeat(2,minmax(0,1fr)) auto;gap:8px;align-items:center}
.ed-set .sn{font-weight:800;color:var(--mut);text-align:center;font-size:13px}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-head h3{font-family:var(--fd);font-style:italic;text-transform:uppercase;font-size:22px;min-width:200px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-wd{font-size:12px;font-weight:800;color:var(--mut);text-align:center;padding:4px 0;letter-spacing:.06em}
.cal-d{min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:7px 8px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s;min-width:0;color:var(--tx)}
.cal-d:hover{border-color:var(--line2)}
.cal-d .dn{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.cal-d.other{opacity:.38}
.cal-d.today{border-color:var(--acc)}
.cal-d.today .dn{color:var(--acc)}
.cal-d.sel{box-shadow:0 0 0 2px var(--tx) inset}
.cal-d .ev{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ev.done{background:rgba(var(--accRGB),.2);color:#ffb08a}
.ev.plan{border:1px dashed rgba(255,255,255,.3);color:var(--tx2)}
.ev.plan.ok{border-color:rgba(var(--okRGB),.6);color:var(--ok)}
.ev.miss{border:1px dashed rgba(var(--badRGB),.5);color:#ff8a8a}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:12px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.wd-pick{display:flex;gap:6px;flex-wrap:wrap}
.wd-pick button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);font-weight:800;color:var(--tx2)}
.wd-pick button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}

/* ---------- achievements ---------- */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ach{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);min-width:0}
.ach .ai{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel3);color:var(--mut2);flex-shrink:0}
.ach .ai .ico{width:21px;height:21px}
.ach.on{border-color:rgba(var(--accRGB),.4);background:linear-gradient(150deg,rgba(var(--accRGB),.1),var(--bg2))}
.ach.on .ai{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.ach .an{font-weight:800;font-size:13.5px;line-height:1.25}
.ach .ad{font-size:12px;color:var(--mut);line-height:1.35;margin-top:2px}
.ach .bar{margin-top:7px}
.lvl-ladder{display:flex;gap:8px;flex-wrap:wrap}
.lvl-step{flex:1;min-width:120px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2)}
.lvl-step b{display:block;font-size:13px}
.lvl-step span{font-size:11.5px;color:var(--mut)}
.lvl-step.on{border-color:rgba(var(--accRGB),.55)}
.lvl-step.cur{background:linear-gradient(150deg,rgba(var(--accRGB),.18),var(--bg2));border-color:var(--acc)}

/* ---------- builder ---------- */
.bl-row{display:grid;grid-template-columns:30px minmax(0,1.6fr) repeat(3,minmax(70px,.6fr)) auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-bottom:8px}
.bl-row .num-i{font-weight:900;color:var(--mut);text-align:center}
.bl-row .bl-n{font-weight:700;min-width:0}
.bl-row .bl-n small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.bl-row label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut);font-weight:700}
.bl-acts{display:flex;gap:4px}
.picker-list{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto;margin-top:12px;padding-right:4px}
.pk{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);text-align:left;color:var(--tx);width:100%}
.pk:hover{border-color:rgba(var(--accRGB),.6)}
.pk .pk-n{font-weight:700;flex:1;min-width:0}
.pk .pk-c{font-size:12px;color:var(--mut)}

/* ---------- training overlay ---------- */
.train-root{position:fixed;inset:0;z-index:200;background:#060607;display:flex;flex-direction:column;overflow:hidden}
.train-root[hidden]{display:none}
.tr-top{display:flex;align-items:center;gap:12px;padding:12px 18px;padding-top:calc(12px + var(--sat));border-bottom:1px solid var(--line);background:#0b0b0d;flex-shrink:0}
.tr-title{flex:1;min-width:0}
.tr-title b{display:block;font-family:var(--fd);font-style:italic;text-transform:uppercase;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-title>span{font-size:12.5px;color:var(--mut)}
.tr-clock{font-family:var(--fd);font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tr-body{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr) 300px;min-height:0}
.tr-list{border-right:1px solid var(--line);overflow-y:auto;padding:14px}
.tr-li{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;border:1px solid transparent;width:100%;background:transparent;color:var(--tx2);text-align:left;margin-bottom:4px}
.tr-li:hover{background:var(--panel)}
.tr-li.cur{background:var(--panel2);border-color:rgba(var(--accRGB),.6);color:var(--tx)}

<script>'use strict';
/* ================= PULLUP PRO — core utilities ================= */
const APP_VERSION = '1.0.0';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const round1 = v => Math.round(v * 10) / 10;
const fmtNum = n => (Math.round((+n || 0) * 10) / 10).toLocaleString('ru-RU');
const plural = (n, f) => { n = Math.abs(Math.round(n)); const a = n % 10, b = n % 100; return f[(a === 1 && b !== 11) ? 0 : (a >= 2 && a <= 4 && (b < 10 || b >= 20)) ? 1 : 2]; };
const pl = (n, f) => `${fmtNum(n)} ${plural(n, f)}`;
const W = {
  rep: ['повтор', 'повтора', 'повторов'], pull: ['подтягивание', 'подтягивания', 'подтягиваний'],
  work: ['тренировка', 'тренировки', 'тренировок'], day: ['день', 'дня', 'дней'], week: ['неделя', 'недели', 'недель'],
  sec: ['секунда', 'секунды', 'секунд'], min: ['минута', 'минуты', 'минут'], set: ['подход', 'подхода', 'подходов'],
  ex: ['упражнение', 'упражнения', 'упражнений'], mu: ['выход', 'выхода', 'выходов'], test: ['тест', 'теста', 'тестов']
};
/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = k => { const [y, m, d] = String(k).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const weekKey = d => dayKey(startOfWeek(typeof d === 'string' ? parseDay(d) : d));
const daysBetween = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 864e5);
const todayKey = () => dayKey(new Date());
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const MONTHS_G = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_S = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const WD_F = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
const wdIdx = d => (d.getDay() + 6) % 7;
const fmtDay = k => { const d = parseDay(k); const y = d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''; return `${d.getDate()} ${MONTHS_G[d.getMonth()]}${y}`; };

/* Pre-training self-check: pain blocks training, low readiness suggests a light version */
function precheck(build, label, extra = [], noLight = false) {
  const r = LG.readiness(), st = { feel: 0, sleep: '', pain: '' };
  const FEEL = ['Плохо', 'Так себе', 'Норм', 'Хорошо', 'Отлично'];
  const sg = (k, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button type="button" data-pk="${k}" data-v="${v}" class="${st[k] === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  let m;
  const draw = () => {
    const ready = st.pain && st.feel, light = st.pain === 'mild' || (st.feel && st.feel <= 2) || st.sleep === 'lt6' || r.lvl !== 'go' || extra.length;
    let res = '';
    if (st.pain === 'pain') res = `<div class="note n-bad">${ico('warn')}<div><b>Тренировка через боль запрещена.</b> Отдохните сегодня. Если боль острая, не проходит или повторяется — обратитесь к врачу или физиотерапевту.</div></div>`;
    else if (ready && light) res = `<div class="note n-warn">${ico('info')}<div><b>Рекомендуем лёгкую версию</b>${noLight ? '' : ': на 1 подход меньше и −20% повторов'}. Прогрессия в лёгкой тренировке не повышается.</div></div>`;
    else if (ready) res = `<div class="note n-ok">${ico('check')}<div><b>Всё в порядке.</b> Начните с разминки — она встроена в тренировку.</div></div>`;
    m.setBody(`<p class="small muted" style="margin-top:-4px">${esc(label)}</p>
      ${r.lvl !== 'go' || extra.length ? `<div class="ready ${extra.length && r.lvl === 'go' ? 'easy' : r.lvl} mb"><span class="dotc"></span><div><b>${r.lvl === 'go' ? 'Обратите внимание' : r.title}</b><div class="small muted">${[...(r.lvl !== 'go' ? r.reasons : []), ...extra].join(' ')}</div></div></div>` : ''}
      <div class="stack l">
        <div><div class="lbl mb">Как вы себя чувствуете?</div><div class="rate">${FEEL.map((f, i) => `<button type="button" data-pk="feel" data-v="${i + 1}" class="${st.feel === i + 1 ? 'on' : ''}">${i + 1}<small>${f}</small></button>`).join('')}</div></div>
        <div><div class="lbl mb">Сон прошлой ночью</div>${sg('sleep', [['lt6', 'меньше 6 ч'], ['6', '6–7 ч'], ['7', '7+ ч']])}</div>
        <div><div class="lbl mb">Есть боль в суставах или мышцах?</div>${sg('pain', [['no', 'Нет'], ['mild', 'Лёгкий дискомфорт'], ['pain', 'Есть боль']])}</div>
        ${res}
      </div>`);
    if (st.pain === 'pain') m.setFoot(`<button class="btn btn-ghost" data-close>Закрыть</button><button class="btn btn-acc" data-pa="rec">${ico('bed')}День восстановления</button>`);
    else if (!ready) m.setFoot(`<span class="small muted grow">Ответьте на вопросы о самочувствии и боли</span><button class="btn btn-ghost" data-close>Отмена</button>`);
    else if (light && !noLight) m.setFoot(`<button class="btn" data-pa="normal">Обычная версия</button><button class="btn btn-acc" data-pa="light">${ico('play')}Лёгкая версия</button>`);
    else m.setFoot(`<button class="btn btn-ghost" data-close>Отмена</button><button class="btn btn-acc" data-pa="normal">${ico('play')}Начать</button>`);
  };
  m = openModal({
    title: 'Проверка самочувствия',
    onMount(box) {
      box.addEventListener('click', e => {
        const b = e.target.closest('[data-pk]');
        if (b) { const k = b.dataset.pk, v = k === 'feel' ? +b.dataset.v : b.dataset.v; st[k] = v; AUD.tap(); draw(); return; }
        const a = e.target.closest('[data-pa]'); if (!a) return;
        if (a.dataset.pa === 'rec') { const k = todayKey(); S.daily[k] = { ...(S.daily[k] || {}), recovery: true }; save(); LG.checkAch(); m.close(); toast('Включён день восстановления. Берегите себя!', 'ok'); rerender(); return; }
        const run = build(a.dataset.pa === 'light'); m.close();
        if (!run) return toast('Не удалось подготовить тренировку', 'err');
        run.check = { feel: st.feel, sleep: st.sleep, pain: st.pain };
        TR.start(run);
      });
    }
  });
  draw();
}

/* ================= Programs & level test ================= */
ROUTES.programs = {
  title: id => id && PROGM[id] ? PROGM[id].name : 'Программы',
  render(id) { return id && PROGM[id] ? progDetail(PROGM[id]) : progList(); }
};
function exitState(P) { return P.exit.map(c => { const cur = LG.metric(c.metric); return { ...c, cur, met: cur >= c.target }; }); }
const critRow = c => { const u = LG.metricUnit(c.metric); return `<div class="crit ${c.met ? 'met' : ''}">${ico(c.met ? 'check' : 'target')}<span>${c.label}</span><span class="cv">${fmtNum(c.cur)}${u} / ${c.target}${u}</span></div>`; };
let TH_MODE = 'pullups';
const TH_OPTS = [['pullups', 'Подтягивания'], ['hang', 'Вис'], ['dips', 'Брусья']];
function testChart(tests) {
  const m = TH_MODE, name = { pullups: 'Подтягивания', hang: 'Вис, с', dips: 'Отжимания на брусьях' }[m];
  return CH.slot({ type: 'line', labels: tests.map(x => fmtDayShort(x.date)), tips: tests.map(x => fmtDay(x.date)),
    series: [{ name, data: tests.map(x => +x[m] || null) }],
    emptyText: tests.length ? 'В тестах пока нет этого показателя' : 'Пройдите первый тест — здесь появится график прогресса', aria: 'Результаты тестов: ' + name }, 220);
}
ACT.thMode = el => { setSeg(el); TH_MODE = el.dataset.v; const c = $('#th-chart'); if (!c) return; c.innerHTML = testChart([...S.tests].sort((a, b) => a.date < b.date ? -1 : 1)); CH.mountAll(c); };

  return pageHead('Программы <em>тренировок</em>', 'Три уровня с прогрессией: нагрузка растёт, когда все подходы выполнены с запасом, и снижается при боли. Рекомендация основана на вашем текущем максимуме.',
    `<button class="btn btn-acc" data-act="testWizard">${ico('test')}Пройти тест уровня</button>`, 'Тренировочные планы') + `
  <div class="grid g3">${PROGRAMS.map(P => {
    const isCur = P.id === cur, isRec = P.id === rec, nw = LG.nextWorkout(P.id), ex = exitState(P);
    return `<div class="card prog-card ${isCur ? 'cur accent' : ''}"><span class="stripe"></span>
      <div class="pc-top"><div><div class="prog-range">${P.range}</div><div class="prog-name">${P.name}</div><div class="small muted">${P.title}</div></div>
        <div class="stack s" style="align-items:flex-end">${isCur ? '<span class="badge b-solid">Текущая</span>' : ''}${isRec ? '<span class="badge b-ok">Рекомендуем</span>' : ''}</div></div>
      <p class="tx2 small" style="margin:0">${P.desc}</p>
      <div class="row wrap small"><span class="badge">${ico('target')}${P.goal}</span><span class="badge">${ico('cal')}${P.freq}</span><span class="badge">${ico('clock')}${P.dur}</span></div>
      <div class="stack s">${ex.map(critRow).join('')}</div>
      <div class="btns mt-s" style="margin-top:auto">
        ${isCur ? `<button class="btn btn-acc" data-act="stProg" data-p="${P.id}" data-i="${nw.idx}">${ico('play')}${nw.w.name}</button>` : `<button class="btn btn-out" data-act="selProg" data-p="${P.id}">Выбрать</button>`}
        <a class="btn btn-ghost btn-tight" href="#/programs/${P.id}">Подробнее ${ico('right')}</a>
      </div></div>`;
  }).join('')}</div>
  <div class="grid g2 mt-l">
    <div class="card">

      ${chart}
      ${tests.length ? `<div class="tbl-wrap mt"><table class="tbl"><thead><tr><th>Дата</th><th>Подтяг.</th><th>Вис</th><th>Брусья</th><th></th></tr></thead><tbody>
        ${[...tests].reverse().slice(0, 6).map(x => `<tr><td>${fmtDay(x.date)}</td><td><b>${x.pullups}</b></td><td>${x.hang ? fmtSec(x.hang) : '—'}</td><td>${x.dips || '—'}</td><td style="text-align:right"><button class="btn btn-ghost btn-icon btn-sm" data-act="delTest" data-id="${x.id}" aria-label="Удалить тест">${ico('trash')}</button></td></tr>`).join('')}
      </tbody></table></div>` : ''}

  </div>`;
}
function progDetail(P) {

          ${items.map(it => `<div class="wk-r"><a href="#/library/${it.ex}">${exOf(it.ex).name}${it.adj ? ` <span class="badge ${it.adj > 0 ? 'b-ok' : 'b-warn'}">${it.adj > 0 ? '+' : ''}${it.adj}${exOf(it.ex).type === 'time' ? '×5 с' : ''}</span>` : ''}</a><span class="dose">${LG.doseText(it)}</span><span class="rest">отдых ${fmtSec(it.rest)}</span></div>`).join('')}
        </div>`;
      }).join('')}
      <div class="small muted">Бейдж «+1» означает автоматическую прогрессию: нагрузка выросла после успешных тренировок.</div>

    <div class="stack l">
      <div class="card"><div class="card-head"><h3>${ico('target')}Критерии перехода</h3></div><div class="stack s">${ex.map(critRow).join('')}</div>
        ${NP ? `<div class="small muted mt">Следующая ступень: <a class="link-btn" href="#/programs/${NP.id}">${NP.name}</a></div>` : `<div class="small muted mt">Следующая ступень — <a class="link-btn" href="#/mu">путь к Muscle-Up</a></div>`}</div>
      <div class="card"><div class="card-head"><h3>${ico('list')}Правила</h3></div><ul class="ul small tx2">${P.rules.map(x => `<li>${x}</li>`).join('')}</ul></div>
      <div class="card"><div class="card-head"><h3>${ico('sun')}Разминка</h3><span class="hint">7–10 мин</span></div><ol class="ol small">${WARMUP.map(w => `<li><b>${w.t}</b><br><span class="muted">${w.d}</span></li>`).join('')}</ol></div>

ACT.selProg = el => {
  const P = PROGM[el.dataset.p]; if (!P) return;
  const m = LG.curMax(), rec = levelForMax(m);
  const doIt = () => { S.profile.program = P.id; save(); toast(`Текущая программа: ${P.name}`, 'ok'); rerender(); };
  if (P.from > m && rec !== P.id) confirmBox('Программа сложнее вашего уровня', `Ваш текущий максимум — ${pl(m, W.rep)}, а ${P.name} рассчитана на ${P.range}. Слишком высокая нагрузка повышает риск травмы. Рекомендуем ${PROGM[rec].name}.`, 'Всё равно выбрать').then(ok => ok && doIt());
  else doIt();
};
ACT.delTest = async el => {
  if (!(await confirmBox('Удалить тест?', 'Результат будет удалён из истории. Это действие нельзя отменить.', 'Удалить', true))) return;
  S.tests = S.tests.filter(x => x.id !== el.dataset.id); save(); toast('Тест удалён', 'ok'); rerender();
};

/* ---------- level test wizard ---------- */
ACT.testWizard = () => {
  const st = { step: 0, warm: {}, pull: 0, hang: 0, hangOn: false, hangT0: 0, dips: 0, dipsDone: false, setProg: true };
  const prev = [...S.tests].sort((a, b) => a.date < b.date ? -1 : 1).pop();
  let timer = 0, m;
  const dots = () => `<div class="steps-dots">${[0, 1, 2, 3, 4].map(i => `<i class="${i <= st.step ? 'on' : ''}"></i>`).join('')}</div>`;
  const counter = (k, label) => `<div class="counter mt"><button class="cnt-btn" data-tw="dn" data-k="${k}" aria-label="Меньше">${ico('minus')}</button><div><div class="cnt-v" data-v>${st[k]}</div><div class="cnt-l">${label}</div></div><button class="cnt-btn" data-tw="up" data-k="${k}" aria-label="Больше">${ico('plus')}</button></div>`;
  const hangVal = () => st.hangOn ? (Date.now() - st.hangT0) / 1000 : st.hang;
  function draw() {
    let b = dots(), f = '';
    if (st.step === 0) {
      b += `<p class="tx2">Тест покажет ваш текущий максимум и подберёт программу. Выполняйте на свежую голову, после отдыха.</p>
        <div class="sec-t mt">Правила засчёта</div><ol class="ol small">${TEST_RULES.map(x => `<li>${x}</li>`).join('')}</ol>
        <div class="sec-t mt">Разминка перед тестом</div>${WARMUP.map((w, i) => `<label class="check"><input type="checkbox" data-tww="${i}" ${st.warm[i] ? 'checked' : ''}><span class="box">${ico('check')}</span><span class="ct">${w.t}<span class="cs">${w.d}</span></span></label>`).join('')}
        <div class="note n-warn mt">${ico('shield')}<div>Тест — максимальное усилие. Есть боль или плохое самочувствие — перенесите тест.</div></div>`;
      const n = Object.values(st.warm).filter(Boolean).length;
      f = `<span class="small muted grow">Разминка: ${n}/${WARMUP.length}</span><button class="btn btn-ghost" data-close>Отмена</button><button class="btn btn-acc" data-tw="next">Далее ${ico('right')}</button>`;
    } else if (st.step === 1) {
      b += `<div class="row top"><div style="width:110px;flex-shrink:0">${FIG.tag('pullup', 'data-label="0"')}</div><div><b class="big">Максимум подтягиваний</b><p class="small muted">Один подход до технического отказа: прямой хват, полная амплитуда, без раскачки. Считайте только чистые повторы.</p></div></div>
        ${counter('pull', 'повторов')}<div class="small muted mt" style="text-align:center">Клавиши: <span class="kbd">+</span> <span class="kbd">−</span></div>`;
      f = `<button class="btn btn-ghost" data-tw="back">Назад</button><button class="btn btn-acc" data-tw="next">Далее ${ico('right')}</button>`;
    } else if (st.step === 2) {
      b += `<div class="row top"><div style="width:110px;flex-shrink:0">${FIG.tag('hang', 'data-label="0"')}</div><div><b class="big">Пассивный вис</b><p class="small muted">Отдохните 3–5 минут после подтягиваний. Затем висите на прямых руках как можно дольше. Нажмите «Старт», когда повиснете.</p></div></div>
        <div style="text-align:center" class="mt"><div class="hold-v" data-hv>${fmtSec(hangVal())}</div>
        <div class="btns mt" style="justify-content:center">${st.hangOn ? `<button class="btn btn-acc btn-lg" data-tw="hstop">${ico('pause')}Стоп</button>` : `<button class="btn btn-acc btn-lg" data-tw="hstart">${ico('play')}${st.hang ? 'Заново' : 'Старт'}</button>`}</div>
        <div class="row mt" style="justify-content:center"><span class="small muted">или вручную, сек:</span>${stepper('tw-hang', Math.round(st.hang), 0, 600, 5)}</div></div>`;
      f = `<button class="btn btn-ghost" data-tw="back">Назад</button><button class="btn btn-acc" data-tw="next">${st.hang ? 'Далее' : 'Пропустить'} ${ico('right')}</button>`;
    } else if (st.step === 3) {
      b += `<div class="row top"><div style="width:110px;flex-shrink:0">${FIG.tag('dips', 'data-label="0"')}</div><div><b class="big">Отжимания на брусьях</b><p class="small muted">Необязательно. Нужны для пути к Muscle-Up. Опускайтесь до угла 90° в локтях, без боли в плечах.</p></div></div>${counter('dips', 'повторов')}`;
      f = `<button class="btn btn-ghost" data-tw="back">Назад</button><button class="btn btn-acc" data-tw="next">${st.dips ? 'Далее' : 'Пропустить'} ${ico('right')}</button>`;
    } else {
      const rec = levelForMax(st.pull), RP = PROGM[rec], d = prev ? st.pull - prev.pullups : null;
      b += `<div style="text-align:center"><div class="eyebrow" style="justify-content:center">Результат теста</div><div class="cnt-v">${st.pull}</div><div class="cnt-l">${plural(st.pull, W.pull)}</div>
        ${d != null ? `<div class="mt-s"><span class="badge ${d > 0 ? 'b-ok' : d < 0 ? 'b-warn' : ''}">${d > 0 ? '+' + d : d < 0 ? '−' + Math.abs(d) : '±0'} к прошлому тесту (${fmtDayShort(prev.date)})</span></div>` : ''}</div>
        <div class="rec-grid mt"><div class="rec"><div class="rl">Вис</div><div class="rv">${st.hang ? fmtSec(st.hang) : '—'}</div></div><div class="rec"><div class="rl">Брусья</div><div class="rv">${st.dips || '—'}</div></div></div>
        <div class="note n-acc mt">${ico('prog')}<div>Рекомендуемая программа: <b>${RP.name}</b> (${RP.range}).</div></div>
        ${rec !== S.profile.program ? `<label class="check mt-s"><input type="checkbox" data-twp ${st.setProg ? 'checked' : ''}><span class="box">${ico('check')}</span><span class="ct">Сделать ${RP.name} текущей программой</span></label>` : ''}
        ${st.pull === 0 ? `<div class="note mt">${ico('info')}<div>0 повторов — это нормальная точка старта. BEGINNER построит силу через негативы, вис и австралийские подтягивания.</div></div>` : ''}`;
      f = `<button class="btn btn-ghost" data-tw="back">Назад</button><button class="btn btn-acc" data-tw="save">${ico('check')}Сохранить результат</button>`;
    }
    m.setBody(b); m.setFoot(f);
  }
  m = openModal({
    title: 'Тест уровня', dismiss: true,
    onClose() { clearInterval(timer); document.removeEventListener('keydown', key); },
    onMount(box) {
      box.addEventListener('click', e => {
        const b = e.target.closest('[data-tw]'); if (!b) return; const a = b.dataset.tw;
        if (a === 'up' || a === 'dn') { const k = b.dataset.k; st[k] = clamp(st[k] + (a === 'up' ? 1 : -1), 0, 100); const v = $('[data-v]', box); v.textContent = st[k]; v.classList.remove('bump'); void v.offsetWidth; v.classList.add('bump'); AUD.tap(); return; }
        if (a === 'next') { st.step = Math.min(4, st.step + 1); if (st.hangOn) stopHang(); }
        if (a === 'back') { st.step = Math.max(0, st.step - 1); if (st.hangOn) stopHang(); }
        if (a === 'hstart') { st.hangOn = true; st.hangT0 = Date.now(); AUD.go(); clearInterval(timer); timer = setInterval(() => { const el = $('[data-hv]', box); if (el) el.textContent = fmtSec(hangVal()); }, 200); }
        if (a === 'hstop') stopHang();
        if (a === 'save') return saveTest();
        draw();
      });
      box.addEventListener('change', e => {
        if (e.target.dataset.tww != null) { st.warm[e.target.dataset.tww] = e.target.checked; const n = Object.values(st.warm).filter(Boolean).length; const s = $('.modal-foot .small', box); if (s) s.textContent = `Разминка: ${n}/${WARMUP.length}`; }
        if (e.target.matches('[data-twp]')) st.setProg = e.target.checked;
      });
      box.addEventListener('input', e => { if (e.target.id === 'tw-hang') { st.hang = clamp(numVal(e.target), 0, 600); const el = $('[data-hv]', box); if (el && !st.hangOn) el.textContent = fmtSec(st.hang); const nb = $('[data-tw="next"]', box); if (nb) nb.innerHTML = `${st.hang ? 'Далее' : 'Пропустить'} ${ico('right')}`; } });
      document.addEventListener('keydown', key);
    }
  });
  function key(e) {
    if (MODALS[MODALS.length - 1] !== m || !(st.step === 1 || st.step === 3)) return;
    const k = st.step === 1 ? 'pull' : 'dips';
    if (e.key === '+' || e.key === '=' || e.key === 'ArrowUp') st[k] = Math.min(100, st[k] + 1);
    else if (e.key === '-' || e.key === 'ArrowDown') st[k] = Math.max(0, st[k] - 1); else return;
    e.preventDefault(); const v = $('[data-v]', m.box); if (v) v.textContent = st[k];
  }
  function stopHang() { st.hang = Math.round(hangVal()); st.hangOn = false; clearInterval(timer); AUD.done(); }
  function saveTest() {
    const t = { id: uid(), date: todayKey(), pullups: st.pull, hang: Math.round(st.hang), dips: st.dips };

  }
  draw();
};

/* ================= Muscle-Up path (6 stages) ================= */
ROUTES.mu = {
  title: 'Muscle-Up',
  render(n) {
    const M = LG.muState(), sel = clamp(+n || (M.cur ? M.cur.n : 6), 1, 6), s = M.st[sel - 1];
    const locked = !s.done && M.st.slice(0, sel - 1).some(x => !x.done), isCur = M.cur && M.cur.n === sel;
    const work = LG.planItems(s.work);
    return pageHead('Путь к <em>Muscle-Up</em>', 'Шесть этапов от силовой базы до чистого выхода силой. Переход дальше — только по критериям, а не по срокам: у каждого свой темп.',
      `<div class="row">${ring(M.pct, 70, 7, `<div class="rg-v" style="font-size:16px">${Math.round(M.pct * 100)}%</div>`)}<div><b>${M.done} из 6</b><div class="small muted">этапов пройдено</div></div></div>`, 'Выход силой') + `
    <div class="note n-warn mb-l">${ico('shield')}<div><b>Безопасность прежде всего.</b><ul class="ul mt-s">${MU_SAFETY.map(x => `<li>${x}</li>`).join('')}</ul></div></div>
    <div class="mu-steps">${M.st.map(x => {
      const c = x.done ? 'done' : (M.cur && M.cur.n === x.n) ? 'cur' : 'lock';
      return `<a href="#/mu/${x.n}" class="mu-st ${c} ${x.n === sel ? 'sel' : ''}" ${x.n === sel ? 'aria-current="step"' : ''}><span class="n">0${x.n}</span><span class="t">${x.title}</span>
        <span class="s">${x.done ? 'Пройден' : c === 'cur' ? `Критерии ${x.met}/${x.crit.length}` : `${ico('lock')} Закрыт`}</span>${pbar(x.done ? 1 : x.met / x.crit.length, x.done ? 'ok thin' : 'thin')}</a>`;
    }).join('')}</div>

const JR = { period: '90', type: 'all', q: '', open: {} };
let ED = null;
ROUTES.journal = {
  title: a => a === 'new' ? 'Новая запись' : a === 'edit' ? 'Редактирование' : 'Журнал',
  render(a, b) {
    if (a === 'new' || (a === 'edit' && S.sessions.some(s => s.id === b))) { const key = a + (b || ''); if (!ED || ED._key !== key) edInit(a === 'edit' ? b : null, key); return edView(); }
    return jrList();
  }
};
const fmtSet = (e, s) => s.done === false ? '<i>пропуск</i>' : e.type === 'time' ? `${s.time || 0} с` : `${s.reps || 0}${s.weight ? `<i> +${fmtNum(s.weight)} кг</i>` : ''}`;
function jrEntries() {
  const lim = JR.period === 'all' ? '' : dayKey(addDays(new Date(), -(+JR.period) + 1)), q = JR.q.trim().toLowerCase();
  const out = [];
  if (JR.type === 'all' || JR.type !== 'test') for (const s of S.sessions) {
    if (lim && s.date < lim) continue;
    if (JR.type !== 'all' && s.source !== JR.type && !(JR.type === 'custom' && (s.source === 'single' || s.source === 'free'))) continue;
    if (q && !((s.title || '') + ' ' + (s.notes || '') + ' ' + (s.items || []).map(i => exOf(i.ex).name).join(' ')).toLowerCase().includes(q)) continue;
    out.push({ k: 's', date: s.date, ts: s.startedAt || 0, s });
  }
  if (JR.type === 'all' || JR.type === 'test') for (const t of S.tests) {
    if (lim && t.date < lim) continue;
    if (q && !'тест уровня'.includes(q)) continue;
    out.push({ k: 't', date: t.date, ts: 0, t });
  }
  return out.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.ts - a.ts);
}
function jrBody() {
  const E = jrEntries(), D = LG.derive();
  const tot = E.reduce((o, x) => { if (x.k === 's') { const st = D.st.get(x.s.id) || LG.sessStats(x.s); o.pull += st.pull; o.dur += x.s.durationSec || 0; if (x.s.source !== 'quick') o.n++; } return o; }, { pull: 0, dur: 0, n: 0 });
  let html = '', mk = '';
  for (const x of E) {
    const m = x.date.slice(0, 7);
    if (m !== mk) {
      mk = m; const d = parseDay(x.date), inM = E.filter(y => y.date.slice(0, 7) === m && y.k === 's');
      const mp = inM.reduce((a, y) => a + (D.st.get(y.s.id) || LG.sessStats(y.s)).pull, 0), mn = inM.filter(y => y.s.source !== 'quick').length;
      html += `<div class="month-h">${MONTHS[d.getMonth()]} ${d.getFullYear()}<small>${pl(mn, W.work)} · ${pl(mp, W.pull)}</small></div>`;
    }
    html += x.k === 's' ? sessCard(x.s) : testCard(x.t);
  }
  return `<div class="small muted">Найдено: ${E.length} · ${pl(tot.n, W.work)} · ${pl(tot.pull, W.pull)} · ${fmtMin(tot.dur)}</div>
      <div id="jr-list">${E.length ? html : emptyBox(S.sessions.length || S.tests.length ? 'Нет записей по фильтру' : 'Журнал пока пуст', S.sessions.length ? 'Измените период, тип или запрос.' : 'Завершите первую тренировку или добавьте запись вручную.', 'list', S.sessions.length ? '' : '<button class="btn btn-sm btn-acc" data-act="startMenu">Начать тренировку</button>')}</div>`;
}

/* mark a matching planned workout as done */
function markPlanDone(s, ref) {
  const list = S.plan[(ref && ref.k) || s.date]; if (!list || !list.length) return;
  let p = ref ? list.find(x => x.id === ref.id) : null;
  if (!p) p = list.find(x => !x.done && ((x.kind === 'program' && s.source === 'program' && s.ref && x.prog === s.ref.prog) || (x.kind === 'mu' && s.source === 'mu') || (x.kind === 'custom' && s.source === 'custom' && s.ref && s.ref.cid === x.cid)));
  if (!p && s.source !== 'quick') p = list.find(x => !x.done);
  if (p) p.done = true;
}

/* ---------- demo data: ~10 weeks of plausible progress ---------- */
function loadDemo() {
  let seed = 20240917; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647, ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const keep = S.profile, st = defaultState();
  st.profile = { ...keep, name: keep.name || 'Алекс', bodyweight: 78, program: 'intermediate', maxPullups: 0, goalDaily: 30, weeklyTarget: 3, onboarded: true, disclaimerAccepted: true };
  const P = PROGM.intermediate, t = todayKey(), start = addDays(startOfWeek(new Date()), -10 * 7);
  const maxAt = w => Math.round(5 + w * .62);
  const mkSets = (it, max, w, fatigue) => {
    const e = exOf(it.ex);
    if (Array.isArray(it.reps)) return it.reps.map(r => ({ reps: r, weight: 0, done: true }));
    if (e.type === 'time') return Array.from({ length: it.sets }, () => ({ time: Math.max(5, (it.time || 20) + ri(-3, 6) + w), done: true }));
    const m = /^p(\d+)$/.exec(it.reps || ''), base = m ? Math.max(1, Math.round(max * +m[1] / 100)) : it.reps + (w > 5 ? 1 : 0);
    return Array.from({ length: it.sets }, (_, i) => ({ reps: Math.max(1, base - (i >= it.sets - 1 && fatigue ? 1 : 0)), weight: it.w || 0, done: true }));
  };
  let idx = 0;
  for (let w = 0; w <= 10; w++) {
    const days = rnd() < .2 ? [0, 3] : [0, 2, 4];
    for (const dd of days) {
      const d = addDays(start, w * 7 + dd + (rnd() < .15 ? 1 : 0)), k = dayKey(d);
      if (daysBetween(k, t) < 2) continue;
      const wo = P.workouts[idx % 3], pain = w === 4 && dd === 2, hour = w === 2 && dd === 0 ? 7 : ri(17, 19);
      const items = wo.items.map(it => ({ ex: it.ex, sets: mkSets(it, maxAt(w), w, rnd() < .5) }));
      if (pain) items.forEach((it, i) => { if (i >= 2) it.sets = it.sets.map(s => ({ ...s, done: false })); });
      st.sessions.push({ id: uid() + w + dd, date: k, startedAt: new Date(d.getFullYear(), d.getMonth(), d.getDate(), hour, ri(0, 50)).getTime(), title: `${P.name} · ${wo.name}`, source: 'program', ref: { prog: P.id, idx: idx % 3, w: wo.id },
        durationSec: ri(36, 52) * 60, items, feel: pain ? 2 : ri(3, 5), pain, light: false, notes: pain ? 'Неприятные ощущения в локте — остановился, следующую тренировку сделал легче.' : (rnd() < .15 ? 'Хорошая техника, последний подход тяжело.' : ''), completed: !pain, warmup: rnd() > .1 });
      if (pain) st.daily[dayKey(addDays(d, 1))] = { recovery: true, tasks: { r1: true, r2: true } };
      idx++;
    }
    // quick sets on a free day
    const qd = addDays(start, w * 7 + 5), qk = dayKey(qd);
    if (daysBetween(qk, t) >= 1 && rnd() < .7) st.sessions.push({ id: uid() + 'q' + w, date: qk, startedAt: qd.getTime() + 12 * 3600e3, title: 'Быстрые подтягивания', source: 'quick', ref: null, durationSec: 0, items: [{ ex: 'pullup', sets: Array.from({ length: ri(3, 6) }, () => ({ reps: ri(3, 6), weight: 0, done: true })) }], feel: 0, pain: false, notes: '', completed: true, warmup: false });
  }
  [[0, 5, 40, 6], [3, 7, 46, 8], [6, 9, 52, 10], [9, 11, 58, 12]].forEach(([w, pu, hg, dp]) => { const k = dayKey(addDays(start, w * 7 + 6)); if (k < t) st.tests.push({ id: uid() + 't' + w, date: k, pullups: pu, hang: hg, dips: dp }); });
  st.profile.maxPullups = 11;
  // Muscle-Up: stage 1 done, stage 2 in progress
  st.mu.checks.s1d = true; st.mu.done[1] = dayKey(addDays(start, 9 * 7 + 6));
  const muDay = addDays(new Date(), -3);
  if (!st.sessions.some(s => s.date === dayKey(muDay))) st.sessions.push({ id: uid() + 'mu', date: dayKey(muDay), startedAt: muDay.getTime() + 18 * 3600e3, title: 'Muscle-Up · Этап 2', source: 'mu', ref: { stage: 2 }, durationSec: 41 * 60,
    items: [{ ex: 'explosive', sets: [3, 3, 3, 2, 2].map(r => ({ reps: r, weight: 0, done: true })) }, { ex: 'ctb', sets: [3, 2, 2].map(r => ({ reps: r, weight: 0, done: true })) }, { ex: 'activehang', sets: [25, 25].map(x => ({ time: x, done: true })) }, { ex: 'hollow', sets: [30, 30].map(x => ({ time: x, done: true })) }],
    feel: 4, pain: false, notes: 'Взрывные пошли выше, грудь почти у перекладины.', completed: true, warmup: true });
  // custom workouts
  st.custom = BL_TPL.slice(0, 2).map(tp => ({ id: uid() + tp.name.length, name: tp.name, items: tp.items.map(x => blItem(...x)), created: dayKey(addDays(start, 14)) }));
  // plans: last 2 weeks + next 2 weeks
  for (let i = -13; i <= 14; i++) {
    const d = addDays(new Date(), i), k = dayKey(d); if (![0, 2, 4].includes(wdIdx(d))) continue;
    const j = ((i + 14) / 2 | 0) % 3, done = st.sessions.some(s => s.date === k && s.source !== 'quick');
    (st.plan[k] = st.plan[k] || []).push({ id: uid() + i, kind: 'program', prog: P.id, idx: j, title: `${P.name} · ${P.workouts[j].name}`, done: i < 0 ? done : false });
  }
  st.ui.planCount = Object.values(st.plan).reduce((a, x) => a + x.length, 0);
  st.progress.intermediate = { next: idx % 3, adj: { 'A:2': 1, 'B:2': 1, 'C:0': 1 } };
  st.ui.tip = 3;
  S = st; save(); LG.checkAch(true); applyAccent();
}
