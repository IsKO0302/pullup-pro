<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="description" content="PULLUP PRO — ISA Personal Fitness: тренировки на всё тело, подтягивания и путь к Muscle-Up, план с прогрессией, журнал, замеры тела и прогресс. Работает офлайн.">
<title>PULLUP PRO — ISA Personal Fitness</title>
<meta name="color-scheme" content="dark light">
<meta name="application-name" content="PULLUP PRO">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PULLUP PRO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="figGlow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="320">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--acc)"/><stop offset="1" stop-color="var(--acc2)"/>
    </linearGradient>
  </defs>
</svg>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/home" aria-label="PULLUP PRO — главная">
      <span class="brand-mark" id="brand-mark"></span>
      <span class="brand-text">PULLUP<b>PRO</b></span>
    </a>
    <nav class="nav" id="nav" aria-label="Разделы"></nav>
    <div class="side-level" id="side-level"></div>
  </aside>
  <div class="main">
    <header class="topbar" id="topbar">
      <a class="brand brand-sm" href="#/home" aria-label="PULLUP PRO — главная"><span class="brand-text">PULLUP<b>PRO</b></span></a>
      <div class="top-level" id="top-level"></div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Навигация"></nav>
</div>
<div id="resume-root"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<div id="train-root" class="train-root" hidden></div>
<noscript><p style="padding:24px;font:16px system-ui;color:#f5f5f7;background:#09090b">Для работы PULLUP PRO включите JavaScript.</p></noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
